<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Your backups are green. Can you actually restore?</title>
  <desc id="desc">Four recovery checkpoints on a dark blue grid: retrieve, restore, validate, and measure.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#183348" stroke-width="1"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081521"/><stop offset="1" stop-color="#102d3a"/></linearGradient>
  </defs>
  <path fill="url(#bg)" d="M0 0h1600v900H0z"/>
  <path fill="url(#grid)" d="M0 0h1600v900H0z"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="100" y="84" width="266" height="42" rx="21" fill="#123b35" stroke="#3ad9a0"/>
    <circle cx="124" cy="105" r="6" fill="#61e8ad"/>
    <text x="143" y="112" fill="#b2f6d8" font-size="17" letter-spacing="2">BACKUP COMPLETED</text>
    <text x="100" y="232" fill="#eff7fa" font-size="72" font-weight="700">Your backups are green.</text>
    <text x="100" y="324" fill="#6ee7ce" font-size="72" font-weight="700">Can you actually restore?</text>
    <text x="104" y="391" fill="#a2b8c8" font-size="27">A recovery drill, from stored data to a working application.</text>
    <path d="M256 566H1344" stroke="#477384" stroke-width="3" stroke-dasharray="9 10"/>
    <g fill="#102633" stroke="#416274" stroke-width="2">
      <rect x="100" y="476" width="320" height="206" rx="18"/>
      <rect x="460" y="476" width="320" height="206" rx="18"/>
      <rect x="820" y="476" width="320" height="206" rx="18"/>
      <rect x="1180" y="476" width="320" height="206" rx="18"/>
    </g>
    <g fill="#6ee7ce" font-size="23" font-family="Menlo, monospace"><text x="130" y="521">01 /</text><text x="490" y="521">02 /</text><text x="850" y="521">03 /</text><text x="1210" y="521">04 /</text></g>
    <g fill="#eff7fa" font-size="36" font-weight="700"><text x="130" y="580">Retrieve</text><text x="490" y="580">Restore</text><text x="850" y="580">Validate</text><text x="1210" y="580">Measure</text></g>
    <g fill="#a2b8c8" font-size="22"><text x="130" y="628">Access the backup</text><text x="490" y="628">Recover files + DB</text><text x="850" y="628">Test real workflows</text><text x="1210" y="628">Check RPO + RTO</text></g>
    <path d="M100 760H1500" stroke="#325062"/>
    <text x="100" y="813" fill="#a2b8c8" font-size="21" letter-spacing="3">LINUX / BACKUP / OPERATIONS</text>
    <text x="1500" y="813" fill="#6ee7ce" font-size="25" text-anchor="end" font-weight="700">emr3.me</text>
  </g>
</svg>
