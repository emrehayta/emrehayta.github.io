<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t"><title id="t">Docker disk cleanup: know what you are removing</title><path fill="#171822" d="M0 0h1600v900H0z"/>
<g font-family="Helvetica,Arial,sans-serif"><text x="90" y="95" fill="#a8a5c4" font-size="22" letter-spacing="4">STORAGE / TROUBLESHOOTING</text><text x="90" y="200" fill="#faf5ec" font-size="72" font-weight="700">Know what you are removing.</text><text x="94" y="258" fill="#aaa8bc" font-size="28">A full disk contains more than disposable cache.</text>
<rect x="90" y="325" width="920" height="440" rx="18" fill="#262735"/>
<rect x="104" y="339" width="402" height="412" rx="9" fill="#7381e0"/><rect x="520" y="339" width="476" height="185" rx="9" fill="#cf9967"/><rect x="520" y="538" width="221" height="213" rx="9" fill="#b7b4d6"/><rect x="755" y="538" width="241" height="213" rx="9" fill="#7ac6b1"/>
<g fill="#171822"><text x="134" y="397" font-size="34" font-weight="700">IMAGE LAYERS</text><text x="134" y="435" font-size="21">Shared across releases</text><path d="m155 555 130-67 130 67-130 67zM155 593l130 67 130-67M155 631l130 67 130-67" fill="none" stroke="#333e8c" stroke-width="4"/>
<text x="550" y="395" font-size="31" font-weight="700">DURABLE VOLUMES</text><text x="550" y="437" font-size="21">Database / uploads / business data</text><text x="550" y="482" font-size="19" font-weight="700">REVIEW OWNER + RECOVERY FIRST</text>
<text x="543" y="593" font-size="26" font-weight="700">BUILD</text><text x="543" y="625" font-size="26" font-weight="700">CACHE</text><text x="543" y="714" font-size="19">Regenerable?</text><text x="778" y="593" font-size="26" font-weight="700">LOGS</text><text x="778" y="714" font-size="19">Set retention</text></g>
<path d="M1060 345v405" stroke="#444352" stroke-width="2"/><text x="1110" y="391" fill="#cf9967" font-size="24" font-weight="700">BEFORE PRUNING</text><g fill="#e5e1ed" font-size="28"><text x="1110" y="472">Inspect the filesystem.</text><text x="1110" y="548">Identify the owner.</text><text x="1110" y="624">Remove deliberately.</text></g><text x="1110" y="714" fill="#aaa8bc" font-size="22">Illustrative map, not measured usage.</text><text x="90" y="839" fill="#aaa8bc" font-size="22">Docker / Linux / capacity</text><text x="1500" y="839" fill="#faf5ec" text-anchor="end" font-size="25" font-weight="700">emr3.me</text></g></svg>
