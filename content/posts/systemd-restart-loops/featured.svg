<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title"><title id="title">Break the restart loop: find the first failure</title>
<defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#282c36"/></pattern></defs>
<path fill="#13171e" d="M0 0h1600v900H0z"/><path fill="url(#grid)" d="M0 0h1600v900H0z"/>
<g font-family="Helvetica,Arial,sans-serif"><text x="90" y="96" font-size="22" letter-spacing="4" fill="#a9b5c8">LINUX / FAILURE ANALYSIS</text>
<text x="90" y="265" font-size="83" font-weight="700" fill="#f4f0e6">Break the</text><text x="90" y="360" font-size="83" font-weight="700" fill="#f4f0e6">restart loop.</text>
<text x="96" y="439" font-size="28" fill="#a9b5c8">Find the first failure.</text><text x="96" y="483" font-size="28" fill="#a9b5c8">Then review the retry policy.</text>
<g transform="translate(1150 450)"><circle r="240" fill="none" stroke="#343c49" stroke-width="48"/><path d="M-207-120A239 239 0 0 1 207-120" fill="none" stroke="#76d8c1" stroke-width="22"/><path d="M235-35A239 239 0 0 1 44 235" fill="none" stroke="#f0b677" stroke-width="22"/><path d="M-40 236A239 239 0 0 1-238-8" fill="none" stroke="#ec8078" stroke-width="22"/>
<path d="m205-152 9 48-46-13" fill="#76d8c1"/><path d="m66 210-37 32 2-49" fill="#f0b677"/><path d="m-214 11-24-45-23 43" fill="#ec8078"/>
<text x="0" y="-28" text-anchor="middle" fill="#f4f0e6" font-size="26" font-family="Menlo,monospace">start → exit</text><text x="0" y="20" text-anchor="middle" fill="#f4f0e6" font-size="26" font-family="Menlo,monospace">→ retry</text><text x="0" y="76" text-anchor="middle" fill="#a9b5c8" font-size="18">The error is earlier in the log.</text></g>
<g font-size="23" font-family="Menlo,monospace"><text x="1090" y="159" fill="#76d8c1">START</text><text x="1425" y="503" fill="#f0b677">EXIT</text><text x="1024" y="761" fill="#ec8078">RETRY</text></g>
<rect x="90" y="585" width="625" height="142" rx="8" fill="#2d2027" stroke="#ec8078" stroke-width="2"/><text x="118" y="632" font-size="22" font-weight="700" fill="#ec8078">RATE LIMIT REACHED</text><text x="118" y="675" font-size="23" fill="#f4f0e6">More retries will not fix a bad configuration.</text><text x="90" y="838" font-size="21" fill="#a9b5c8">SYSTEMD / JOURNAL / RECOVERY</text><text x="1500" y="838" text-anchor="end" font-size="25" font-weight="700" fill="#f4f0e6">emr3.me</text></g></svg>
